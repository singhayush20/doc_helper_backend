spring:
  application:
    name: doc_helper
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    enabled: true
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    baseline-description: "init"
    baseline-version: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: true
    mongo:
      enabled: true


